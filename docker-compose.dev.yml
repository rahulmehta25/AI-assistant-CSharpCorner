version: '3.8'

# Development Docker Compose Configuration
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: career_assistant_db_dev
    environment:
      POSTGRES_DB: career_assistant_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_assistant_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - career_dev_network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: career_assistant_redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - career_dev_network

  # FastAPI Backend (Development with hot reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: career_assistant_backend_dev
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/career_assistant_dev
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=dev-secret-key-not-for-production
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      # Mount source code for hot reload
      - ./modules:/app/modules:ro
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./api_bridge.py:/app/api_bridge.py:ro
      - ./main.py:/app/main.py:ro
      - ./main_integrated.py:/app/main_integrated.py:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - career_dev_network

  # React/Vite Frontend (Development with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      target: development
    container_name: career_assistant_frontend_dev
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Exclude node_modules
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - career_dev_network

  # Background Worker (Development)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: career_assistant_worker_dev
    command: python -m backend.workers.queue_worker --debug
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/career_assistant_dev
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      - ./modules:/app/modules:ro
      - ./backend:/app/backend
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - career_dev_network

  # Redis Commander (Redis GUI for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: career_assistant_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - career_dev_network

  # pgAdmin (PostgreSQL GUI for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: career_assistant_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - career_dev_network

  # Mailhog (Email testing for development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: career_assistant_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - career_dev_network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  career_dev_network:
    driver: bridge
